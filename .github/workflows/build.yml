name: LavO Gaming Hub

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and web build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate project
        run: |
          if [ -f package.json ] && [ -d www ]; then
            rm -f Cargo.toml Cargo.lock
            echo "P=." >> "$GITHUB_ENV"
          elif [ -f lavo-gaming-hub.zip ]; then
            python -c "import zipfile; zipfile.ZipFile('lavo-gaming-hub.zip').extractall('.')"
            rm -f Cargo.toml Cargo.lock
            echo "P=lavo-gaming-hub" >> "$GITHUB_ENV"
          else
            echo "Could not find the LavO project: package.json and the www folder must be at the top level of the repo."
            exit 1
          fi

      - name: Install dependencies
        working-directory: ${{ env.P }}
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Test
        working-directory: ${{ env.P }}
        run: npm test

      - name: Build web app
        working-directory: ${{ env.P }}
        run: npm run build:web

      - uses: actions/upload-artifact@v4
        with:
          name: LavO-Web
          path: ${{ env.P }}/dist

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Locate project
        run: |
          if [ -f package.json ] && [ -d www ]; then
            rm -f Cargo.toml Cargo.lock
            echo "P=." >> "$GITHUB_ENV"
          elif [ -f lavo-gaming-hub.zip ]; then
            python -c "import zipfile; zipfile.ZipFile('lavo-gaming-hub.zip').extractall('.')"
            rm -f Cargo.toml Cargo.lock
            echo "P=lavo-gaming-hub" >> "$GITHUB_ENV"
          else
            echo "Could not find the LavO project: package.json and the www folder must be at the top level of the repo."
            exit 1
          fi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.P }}/src-tauri

      - name: Install dependencies
        working-directory: ${{ env.P }}
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Generate icons from the logo
        working-directory: ${{ env.P }}
        run: npx tauri icon app-icon.png

      - name: Build Windows app
        working-directory: ${{ env.P }}
        run: npx tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LavO-Gaming-Hub-Windows-Installer
          path: ${{ env.P }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: LavO-Gaming-Hub-Windows-Portable
          path: ${{ env.P }}/src-tauri/target/release/lavo-gaming-hub.exe
          if-no-files-found: error

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate project
        run: |
          if [ -f package.json ] && [ -d www ]; then
            rm -f Cargo.toml Cargo.lock
            echo "P=." >> "$GITHUB_ENV"
          elif [ -f lavo-gaming-hub.zip ]; then
            python -c "import zipfile; zipfile.ZipFile('lavo-gaming-hub.zip').extractall('.')"
            rm -f Cargo.toml Cargo.lock
            echo "P=lavo-gaming-hub" >> "$GITHUB_ENV"
          else
            echo "Could not find the LavO project: package.json and the www folder must be at the top level of the repo."
            exit 1
          fi

      - name: Install dependencies
        working-directory: ${{ env.P }}
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          pip install pillow

      - name: Create Android project
        working-directory: ${{ env.P }}
        run: |
          rm -rf android
          npx cap add android
          python scripts/android-icons.py
          npx cap sync android

      - name: Build APK
        working-directory: ${{ env.P }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../LavO-Gaming-Hub.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LavO-Gaming-Hub-Android
          path: ${{ env.P }}/LavO-Gaming-Hub.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          pattern: LavO-Gaming-Hub-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LavO Gaming Hub build ${{ github.run_number }}
          prerelease: true
          fail_on_unmatched_files: true
          files: release-files/*
