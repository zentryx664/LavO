name: Build LavO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Optional repo secrets. If unset, the app asks for the server on first launch.
  VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  VITE_TURN_URL: ${{ secrets.TURN_URL }}
  VITE_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
  VITE_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}

jobs:
  test:
    name: Test and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: LavO-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Generate Android project and add permissions
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          npm run tauri -- android init --ci
          node scripts/patch-android.mjs

      - name: Build release APK (arm64)
        run: npm run tauri -- android build --apk --target aarch64

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=$(find src-tauri/gen/android -name '*.apk' -path '*release*' | head -n 1)
          [ -n "$APK" ] || { echo "No release APK found"; exit 1; }
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"

          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            STORE_PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"
          else
            echo "::warning::No release keystore configured. Signing with a throwaway key (fine for testing, not for updates)."
            STORE_PASS="lavo-test-key"; ALIAS="lavo"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
              -dname "CN=LavO,O=LavO,C=US"
          fi

          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STORE_PASS" --key-pass "pass:$STORE_PASS" \
            --out LavO-android-arm64.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify LavO-android-arm64.apk
          ls -lh LavO-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LavO-android-apk
          path: LavO-android-arm64.apk
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
          generate_release_notes: true
          
