[package]
name = "lavo"
version = "0.1.0"
description = "LavO - lightweight gaming voice & chat"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lavo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
